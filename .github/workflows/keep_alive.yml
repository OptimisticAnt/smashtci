name: Keep Supabase Awake
on:
  schedule:
    - cron: '0 12 * * 1,4' # Every Monday and Thursday at noon UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send a database request
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "Missing SUPABASE_KEY secret. Add it in GitHub repository settings > Secrets and variables > Actions."
            exit 1
          fi

          curl -sf "https://hwmpydyexqctnigpgrng.supabase.co/rest/v1/store?select=*&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" -o /dev/null
          echo "Supabase pinged OK"
