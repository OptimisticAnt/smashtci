name: Keep Supabase Awake
on:
  schedule:
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://xjdvbxvhjasqhlawiiji.supabase.co/rest/v1/" \
            -H "apikey: sb_publishable_j2X9ySmlrJRQQeqQFzbugw_H12nwE8P")
          echo "Supabase responded: $CODE"
          if [ "$CODE" = "000" ] || [ "$CODE" -ge 500 ]; then exit 1; fi
          echo "Supabase is awake"
